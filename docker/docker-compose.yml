services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - minio
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-file:./data/dev.db}"
      REDIS_URL: "${REDIS_URL}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_BUCKET: "${S3_BUCKET:-ai-video-studio}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_REGION: "${S3_REGION:-us-east-1}"
    volumes:
      - app-data:/app/data

  workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile.workers
    depends_on:
      - minio
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-file:./data/dev.db}"
      REDIS_URL: "${REDIS_URL}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_BUCKET: "${S3_BUCKET:-ai-video-studio}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_REGION: "${S3_REGION:-us-east-1}"
    volumes:
      - app-data:/app/data
    deploy:
      replicas: 2

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - miniodata:/data

volumes:
  app-data:
  miniodata:
